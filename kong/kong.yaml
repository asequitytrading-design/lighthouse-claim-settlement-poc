# Kong declarative seed for the local Lighthouse AI gateway (decK format).
# Each logical model name is one route. Applications call
#   http://localhost:8100/ai/<logical-model>/chat/completions
# and Kong's ai-proxy chooses the physical model, so swapping a model is a gateway
# change, not a code change. Secrets come from DECK_* environment variables.
_format_version: "3.0"

services:
  - name: ollama-local
    url: ${{ env "DECK_OLLAMA_UPSTREAM" }}
    tags: [lighthouse, local]
    # Kong's per-service default is 60 s, which returns 504 while Ollama swaps models
    # in and out of memory (observed > 100 s per request during judge runs).
    connect_timeout: 10000
    read_timeout: 600000
    write_timeout: 600000
    plugins:
      - name: key-auth
        config:
          key_names: [apikey]
          hide_credentials: true
      # Provider capability shims (second block below): Ollama answers `response_format` (JSON mode) with
      # HTTP 501, which MLflow judges only retry without JSON mode after HTTP 400.
      # Dropping the field makes callers rely on prompt instructions + validation.
      # request-transformer cannot do this: ai-proxy rebuilds the upstream body from
      # the client request, so the client body itself is edited before ai-proxy runs.
      #
      # Credential shim: OpenAI-compatible clients that can only send
      # `Authorization: Bearer <key>` (the MLflow UI AI Gateway) are mapped to the
      # `apikey` header before key-auth runs (pre-function has higher priority), and the
      # Authorization header is removed so it never reaches the upstream.
      - name: pre-function
        config:
          access:
            - |
              if not kong.request.get_header("apikey") then
                local auth = kong.request.get_header("authorization")
                local token = auth and auth:match("^[Bb]earer%s+(%S+)%s*$")
                if token then
                  kong.service.request.set_header("apikey", token)
                  kong.service.request.clear_header("authorization")
                end
              end
            - |
              -- Body shims: drop response_format (Ollama 501) and default
              -- reasoning_effort to "none" when the caller did not choose one (local
              -- Qwen3.5 otherwise spends the token budget thinking and returns empty
              -- content to clients that cannot set it, e.g. the MLflow UI Playground).
              local raw = kong.request.get_raw_body()
              if raw and (raw:find('"response_format"', 1, true)
                          or not raw:find('"reasoning_effort"', 1, true)) then
                local cjson = require("cjson.safe")
                local body = cjson.decode(raw)
                if type(body) == "table" then
                  body.response_format = nil
                  if body.reasoning_effort == nil then
                    body.reasoning_effort = "none"
                  end
                  ngx.req.set_body_data(cjson.encode(body))
                end
              end
    routes:
      - name: claims-small
        paths: [/ai/claims-small]
        strip_path: true
        tags: [lighthouse, app-model]
        plugins:
          - name: ai-proxy
            config:
              route_type: llm/v1/chat
              model:
                provider: openai
                name: qwen3.5-4b-32k:latest
                options:
                  upstream_url: ${{ env "DECK_OLLAMA_UPSTREAM" }}/v1/chat/completions
              logging:
                log_statistics: true
                log_payloads: false
      - name: claims-medium
        paths: [/ai/claims-medium]
        strip_path: true
        tags: [lighthouse, app-model]
        plugins:
          - name: ai-proxy
            config:
              route_type: llm/v1/chat
              model:
                provider: openai
                name: qwen3.5-9b-32k:latest
                options:
                  upstream_url: ${{ env "DECK_OLLAMA_UPSTREAM" }}/v1/chat/completions
              logging:
                log_statistics: true
                log_payloads: false
      - name: claims-judge
        paths: [/ai/claims-judge]
        strip_path: true
        tags: [lighthouse, judge-model]
        plugins:
          - name: ai-proxy
            config:
              route_type: llm/v1/chat
              model:
                provider: openai
                name: gemma4-e4b-32k:latest
                options:
                  upstream_url: ${{ env "DECK_OLLAMA_UPSTREAM" }}/v1/chat/completions
              logging:
                log_statistics: true
                log_payloads: false

consumers:
  - username: lighthouse-local-dev
    tags: [lighthouse]
    keyauth_credentials:
      - key: ${{ env "DECK_LIGHTHOUSE_API_KEY" }}

plugins:
  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid
      echo_downstream: true
  # Token/latency statistics per request, without prompt or response payloads.
  - name: file-log
    config:
      path: /dev/stdout
      reopen: false
