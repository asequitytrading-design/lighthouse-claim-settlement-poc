# Kong declarative seed for the local Lighthouse AI gateway (decK format).
# Each logical model name is one route. Applications call
#   http://localhost:8100/ai/<logical-model>/chat/completions
# and Kong's ai-proxy chooses the physical model, so swapping a model is a gateway
# change, not a code change. Secrets come from DECK_* environment variables.
_format_version: "3.0"

services:
  - name: ollama-local
    url: ${{ env "DECK_OLLAMA_UPSTREAM" }}
    tags: [lighthouse, local]
    plugins:
      - name: key-auth
        config:
          key_names: [apikey]
          hide_credentials: true
    routes:
      - name: claims-small
        paths: [/ai/claims-small]
        strip_path: true
        tags: [lighthouse, app-model]
        plugins:
          - name: ai-proxy
            config:
              route_type: llm/v1/chat
              model:
                provider: openai
                name: qwen3.5-4b-32k:latest
                options:
                  upstream_url: ${{ env "DECK_OLLAMA_UPSTREAM" }}/v1/chat/completions
              logging:
                log_statistics: true
                log_payloads: false
      - name: claims-medium
        paths: [/ai/claims-medium]
        strip_path: true
        tags: [lighthouse, app-model]
        plugins:
          - name: ai-proxy
            config:
              route_type: llm/v1/chat
              model:
                provider: openai
                name: qwen3.5-9b-32k:latest
                options:
                  upstream_url: ${{ env "DECK_OLLAMA_UPSTREAM" }}/v1/chat/completions
              logging:
                log_statistics: true
                log_payloads: false
      - name: claims-judge
        paths: [/ai/claims-judge]
        strip_path: true
        tags: [lighthouse, judge-model]
        plugins:
          - name: ai-proxy
            config:
              route_type: llm/v1/chat
              model:
                provider: openai
                name: gemma4-e4b-32k:latest
                options:
                  upstream_url: ${{ env "DECK_OLLAMA_UPSTREAM" }}/v1/chat/completions
              logging:
                log_statistics: true
                log_payloads: false

consumers:
  - username: lighthouse-local-dev
    tags: [lighthouse]
    keyauth_credentials:
      - key: ${{ env "DECK_LIGHTHOUSE_API_KEY" }}

plugins:
  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid
      echo_downstream: true
  # Token/latency statistics per request, without prompt or response payloads.
  - name: file-log
    config:
      path: /dev/stdout
      reopen: false
