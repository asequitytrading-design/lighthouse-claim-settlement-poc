# Databricks Asset Bundle: deploys the Lighthouse prompt-registry + evaluation job.
# Same code and config/profiles/databricks.yaml as local runs; the bundle only supplies
# workspace-specific, non-secret inputs. See docs/databricks-setup.md.
#
#   databricks bundle validate            # target dev (default)
#   databricks bundle deploy
#   databricks bundle run lighthouse_prompt_eval
#   databricks bundle run lighthouse_prompt_eval --params app_model=claims-medium,scorer_mode=llm-judges
bundle:
  name: lighthouse-claim-settlement-poc
  databricks_cli_version: ">= 1.24.0"

include:
  - resources/*.yml

sync:
  # .gitignore is honoured (.env, .venv, MLflow state are never uploaded).
  include:
    - apps/lighthouse_demo/web/dist/**          # built UI (gitignored, served by the app)
  exclude:
    - apps/lighthouse_demo/web/node_modules/**
    - apps/lighthouse_demo/web/src/**
    - app/**
    - kong/**
    - docker-compose.yml
    - tests/**
    - .github/**
    - scripts/meeting_summary_format_judge.py   # local-only experiment (never on Databricks)
    - scripts/meeting_summariser_iterate.py      # local-only experiment (never on Databricks)

variables:
  genie_space_id:
    description: Genie space of the claims copilot (lighthouse platform genie ensure prints it).
    default: ""
  warehouse_id:
    description: SQL warehouse the demo app queries (usage, evals, Genie).
    default: ""
  session_store:
    description: Demo app sessions + semantic cache. sqlite (testing; app disk is ephemeral) or lakebase (demo; start the instance first).
    default: sqlite
  lakebase_instance:
    description: Lakebase database instance bound to the demo app (create with scripts/lakebase.py).
    default: lighthouse-demo
  catalog:
    description: Unity Catalog catalog for the schema that holds prompts (Free Edition usually `workspace`).
    default: workspace
  schema:
    description: Schema created by this bundle for prompts (dev mode prefixes it per user).
    default: lighthouse
  # Defaults: models verified to answer chat completions through Unity Gateway on a Free
  # Edition workspace (2026-11-25). Override per workspace with --var or BUNDLE_VAR_*.
  small_model_service:
    description: Unity Gateway model service for logical model claims-small (fully qualified, e.g. system.ai.<model>).
    default: system.ai.gpt-oss-20b
  medium_model_service:
    description: Unity Gateway model service for logical model claims-medium (Qwen 3.5 family, like local).
    default: system.ai.qwen35-122b-a10b
  platform_prefix:
    description: >-
      Schema prefix of the AI Marketplace platform schemas (<prefix>ai_observability, ...).
      Usage events of job runs are written there. Shared targets use "" (the dev target sets a
      personal prefix, the same one notebooks 02-05 default to).
    default: ""
  judge_model_service:
    description: Unity Gateway model service for logical judge claims-judge (different family from claims-medium).
    default: system.ai.gpt-oss-120b

targets:
  # Personal development: resources are prefixed "[dev <user>]", schedules paused.
  dev:
    mode: development
    default: true
    variables:
      platform_prefix: dev_${workspace.current_user.short_name}_
      # demo app: genie_space_id and warehouse_id are workspace-specific and not committed; put them in
      # .databricks/bundle/dev/variable-overrides.json (gitignored), e.g.
      #   {"genie_space_id": "<lighthouse platform genie ensure>", "warehouse_id": "<SQL warehouse id>"}
      # or pass --var / BUNDLE_VAR_genie_space_id, BUNDLE_VAR_warehouse_id.
      session_store: lakebase

  # Deployment used by GitHub Actions. Files live in the deploying identity's home folder
  # (service principal lighthouse-ci), not /Workspace/Shared, which every user can write.
  ci:
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
