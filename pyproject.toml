[project]
name = "lighthouse-claim-settlement-poc"
version = "0.5.0"
description = "Synthetic life and health claim settlement prompt registry and evaluation starter"
requires-python = ">=3.10"
dependencies = ["mlflow[databricks]>=3.18,<4", "openai>=1.0", "databricks-sdk>=0.38", "pyyaml>=6"]

[project.scripts]
lighthouse = "lighthouse_poc.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
# AI Marketplace data platform on Unity Catalog (ADR-012/013): schema migrations, Vector Search.
platform = ["alembic>=1.13,<2", "databricks-sqlalchemy>=2.0.8,<3", "databricks-vectorsearch>=0.57"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Alembic environment and revisions are data files of the platform package (no __init__.py).
"lighthouse_poc.platform" = ["alembic/*.py", "alembic/*.mako", "alembic/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
