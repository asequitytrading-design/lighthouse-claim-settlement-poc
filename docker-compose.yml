services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    command: >-
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow-data/mlflow.db
      --default-artifact-root /mlflow-artifacts
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-data:/mlflow-data
      - mlflow-artifacts:/mlflow-artifacts
volumes:
  mlflow-data:
  mlflow-artifacts:
