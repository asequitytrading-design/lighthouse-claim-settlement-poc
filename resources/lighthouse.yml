# Workspace resources for the Lighthouse POC. Paths are relative to this file.
resources:
  schemas:
    lighthouse:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: Lighthouse POC prompts (synthetic claim data only).

  experiments:
    # Archive: runs and traces before 2026-11-27 (traces in MLflow storage; an experiment that
    # already holds traces cannot be linked to Unity Catalog trace tables). Kept read-only.
    lighthouse_eval:
      name: /Workspace/Users/${workspace.current_user.userName}/lighthouse-claim-settlement-poc-${bundle.target}
    # Active experiment: its traces are stored in Unity Catalog (ADR-017), linked on first use.
    lighthouse_eval_uc:
      name: /Workspace/Users/${workspace.current_user.userName}/lighthouse-claim-settlement-poc-uc-${bundle.target}

  # Demo app (docs/demo-thin-ui.md): lighthouse-api + the built UI, run as the app's service
  # principal. Free Edition: start it for testing and the demo, stop it otherwise
  # (databricks apps stop <name>). Grants: lighthouse platform app grants --principal <app SP id>.
  apps:
    lighthouse_demo:
      name: lighthouse-demo-${bundle.target}
      description: Lighthouse claims copilot demo (synthetic data)
      source_code_path: ..
      config:
        command: ["python", "apps/lighthouse_demo/serve.py"]
        env:
          - {name: LIGHTHOUSE_PROFILE, value: databricks}
          - {name: LIGHTHOUSE_CATALOG, value: "${var.catalog}"}
          - {name: LIGHTHOUSE_SCHEMA, value: "${resources.schemas.lighthouse.name}"}
          - {name: LIGHTHOUSE_PLATFORM_PREFIX, value: "${var.platform_prefix}"}
          - {name: LIGHTHOUSE_ENVIRONMENT, value: "${bundle.target}"}
          - {name: LIGHTHOUSE_APP_USE_CASE, value: claims_copilot}
          - {name: LIGHTHOUSE_SESSION_STORE, value: sqlite}
          - {name: LIGHTHOUSE_SQLITE_PATH, value: /tmp/lighthouse/sessions.db}
          - {name: LIGHTHOUSE_GENIE_SPACE_ID, value: "${var.genie_space_id}"}
          - {name: DATABRICKS_WAREHOUSE_ID, value_from: sql-warehouse}
          - {name: MLFLOW_DISABLE_AGENT_HINT, value: "1"}
      resources:
        - name: sql-warehouse
          sql_warehouse: {id: "${var.warehouse_id}", permission: CAN_USE}
        - name: genie-space
          genie_space: {name: lighthouse-claims, space_id: "${var.genie_space_id}", permission: CAN_RUN}

  jobs:
    lighthouse_prompt_eval:
      name: lighthouse-prompt-eval-${bundle.target}
      description: >-
        Registers the claim-settlement prompt in Unity Catalog (only when the template
        changed) and evaluates it on the versioned synthetic golden set against the
        published @champion version (hard gates + rubric + judges -> review score).
        Approval is a separate human step (lighthouse promote). Administrative,
        non-decisional POC; a human examiner makes all settlement decisions.
      max_concurrent_runs: 1        # Free Edition: max 5 concurrent job tasks per account
      timeout_seconds: 3600
      queue:
        enabled: true
      tags:
        project: lighthouse-poc
        data: synthetic

      # Defaults give a first run that needs no model access (mock app model,
      # deterministic gates). Override per run, e.g. app_model=claims-medium,
      # scorer_mode=llm-judges, judge_model=databricks-managed-judge.
      parameters:
        - name: app_model
          default: mock
        - name: scorer_mode
          default: deterministic
        - name: judge_model
          default: databricks-managed-judge
        - name: limit
          default: "0"

      environments:
        - environment_key: lighthouse
          spec:
            environment_version: "5"   # Python 3.12; released 2026-02-25
            dependencies:
              - mlflow[databricks]>=3.18,<4
              - openai>=1.0
              - pyyaml>=6
              - databricks-agents>=1.13   # Databricks-managed judges (model URI "databricks")
              - databricks-sqlalchemy>=2.0.8,<3   # usage events -> ai_observability (ADR-013)
              - alembic>=1.13,<2                  # schema revision check before writing events

      tasks:
        - task_key: register_prompt
          environment_key: lighthouse
          spark_python_task:
            python_file: ../scripts/register_prompt.py
            parameters:
              - --profile
              - databricks
              - --if-changed
              - --change-note
              - "Deployed from ${bundle.name} (${bundle.target}) at ${bundle.git.commit}"
              - --task-value-key
              - prompt_version
              - --env
              - LIGHTHOUSE_CATALOG=${var.catalog}
              - --env
              - LIGHTHOUSE_SCHEMA=${resources.schemas.lighthouse.name}

        # Evaluates the version register_prompt produced (new or unchanged) with the
        # published @champion as baseline: champion regression on every run, and the
        # candidate's run is the evidence `lighthouse promote` needs. Before the first
        # approval there is no @champion and the baseline is skipped with a notice.
        # A BLOCKED candidate fails the task.
        - task_key: evaluate
          depends_on:
            - task_key: register_prompt
          environment_key: lighthouse
          spark_python_task:
            python_file: ../scripts/lighthouse.py
            parameters:
              - --profile
              - databricks
              - --env
              - LIGHTHOUSE_CATALOG=${var.catalog}
              - --env
              - LIGHTHOUSE_SCHEMA=${resources.schemas.lighthouse.name}
              - --env
              - LIGHTHOUSE_EXPERIMENT=${resources.experiments.lighthouse_eval_uc.name}
              - --env
              - GIT_COMMIT=${bundle.git.commit}
              - --env
              - LIGHTHOUSE_PLATFORM_PREFIX=${var.platform_prefix}
              - --env
              - LIGHTHOUSE_ENVIRONMENT=${bundle.target}
              - --env
              - UNITY_GATEWAY_SMALL_MODEL=${var.small_model_service}
              - --env
              - UNITY_GATEWAY_MEDIUM_MODEL=${var.medium_model_service}
              - --env
              - UNITY_GATEWAY_JUDGE_MODEL=${var.judge_model_service}
              - eval
              - --prompt
              - "{{tasks.register_prompt.values.prompt_version}}"
              - --baseline
              - "@champion"
              - --baseline-optional
              - --model
              - "{{job.parameters.app_model}}"
              - --scorer-mode
              - "{{job.parameters.scorer_mode}}"
              - --judge-model
              - "{{job.parameters.judge_model}}"
              - --limit
              - "{{job.parameters.limit}}"

    # Keeps <prefix>ai_observability.gateway_usage (the local copy of system.ai_gateway.usage
    # that the usage/cost views and the dashboard read, revision 0004) up to date. In the dev
    # target, development mode pauses the schedule: unpause it in the Jobs UI, or run the sync
    # from notebook 04 / `lighthouse platform usage sync`.
    lighthouse_platform_usage_sync:
      name: lighthouse-platform-usage-sync-${bundle.target}
      description: Copies new Unity Gateway usage rows (with Lighthouse request tags) into ai_observability.gateway_usage.
      max_concurrent_runs: 1
      timeout_seconds: 900
      schedule:
        quartz_cron_expression: "0 5 * * * ?"     # hourly, 5 minutes past
        timezone_id: UTC
      tags:
        project: lighthouse-poc
        data: synthetic
      environments:
        - environment_key: platform
          spec:
            environment_version: "5"
            dependencies:
              - pyyaml>=6
              - openai>=1.0
              - databricks-sqlalchemy>=2.0.8,<3
      tasks:
        - task_key: usage_sync
          environment_key: platform
          spark_python_task:
            python_file: ../scripts/lighthouse.py
            parameters:
              - --profile
              - databricks
              - platform
              - usage
              - sync
              - --env
              - LIGHTHOUSE_CATALOG=${var.catalog}
              - --prefix
              - ${var.platform_prefix}
