# Databricks profile: workspace MLflow + Unity Gateway.
# Values marked VERIFY depend on the workspace (Free Edition catalogs, available
# model services); override them with environment variables / job parameters
# instead of editing code. See docs/local-development.md and the Databricks guide.
environment: databricks

mlflow:
  tracking_uri: databricks
  registry_uri: databricks-uc   # prompts live in Unity Catalog (catalog.schema.name)
  experiment: ${LIGHTHOUSE_EXPERIMENT:-/Shared/lighthouse-claim-settlement-poc}

registry:
  # VERIFY: Free Edition workspaces normally expose the `workspace` catalog.
  prompt_name: ${LIGHTHOUSE_CATALOG:-workspace}.${LIGHTHOUSE_SCHEMA:-lighthouse}.claim_settlement_review

gateway:
  kind: unity_gateway
  base_url: ${DATABRICKS_HOST}/ai-gateway/mlflow/v1
  auth:
    # Uses databricks-sdk unified auth: notebook/job identity, OAuth or a PAT.
    type: databricks_sdk
  timeout_seconds: 300
  max_retries: 2

# Same logical names as the local profile. upstream_model is the qualified
# Unity Gateway model service. VERIFY which services the workspace offers.
models:
  claims-small:
    upstream_model: ${UNITY_GATEWAY_SMALL_MODEL}
    params: {temperature: 0}
  claims-medium:
    upstream_model: ${UNITY_GATEWAY_MEDIUM_MODEL}
    params: {temperature: 0}
  claims-judge:
    upstream_model: ${UNITY_GATEWAY_JUDGE_MODEL}
    params: {temperature: 0}
  embed-default:                 # knowledge-base + query embeddings (config/model_catalog.yaml)
    task: embeddings
    upstream_model: ${UNITY_GATEWAY_EMBEDDING_MODEL:-system.ai.qwen3-embedding-0-6b}
  databricks-managed-judge:      # MLflow's Databricks-managed judge, not via Unity Gateway
    kind: mlflow_uri
    model_uri: databricks
  mock:
    kind: mock

defaults:
  app_model: claims-medium
  judge_model: claims-judge

evaluation:
  max_workers: 4
  max_scorer_workers: 3

# AI Marketplace data platform in Unity Catalog (docs/ai-marketplace-platform.md, ADR-012).
# Schemas: <prefix>ai_marketplace, <prefix>ai_observability, <prefix>ai_knowledge. A personal
# dev prefix (e.g. dev_<user>_) keeps experiments apart; shared targets use an empty prefix.
platform:
  catalog: ${LIGHTHOUSE_CATALOG:-workspace}
  schema_prefix: ${LIGHTHOUSE_PLATFORM_PREFIX:-}
  warehouse_id: ${DATABRICKS_WAREHOUSE_ID:-}        # empty: the first available SQL warehouse
  vector_search_endpoint: ${LIGHTHOUSE_VS_ENDPOINT:-lighthouse-vs}   # Free Edition: one endpoint
  embedding_model: embed-default
